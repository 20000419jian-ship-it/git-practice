<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的个人名片</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <div class="avatar">🦊</div>
    <h1>Henry</h1>
    <p class="title">学习者 / Git 新手（暂时的）</p>
    <p class="bio">
      大家好！我正在学习 Git 和 GitHub。
      这个页面是我练手项目的一部分，每次学会一个 Git 命令，
      我就会提交（commit）一次。
    </p>
    <ul class="skills">
      <li>HTML</li>
      <li>CSS</li>
      <li>Git</li>
    </ul>
    <footer>
      <p id="counter">这个页面被打开过 ? 次</p>
      <button id="likeBtn">👍 点赞 <span id="likeCount">0</span></button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
